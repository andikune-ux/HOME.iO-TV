name: Build & Auto Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Verify Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "❌ debug.keystore TIDAK ADA di repo!"
            exit 1
          fi
          echo "✅ Keystore ditemukan"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Show Generated APK
        run: |
          echo "🔍 Mencari file APK yang dihasilkan..."
          find app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeIO-TV-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Generate Version Tag
        id: get_version
        run: |
          YEAR=$(TZ='Asia/Jakarta' date +%Y)
          MONTH=$(TZ='Asia/Jakarta' date +%m)
          DAY=$(TZ='Asia/Jakarta' date +%d)
          
          START_YEAR=2026
          START_MONTH=10
          
          MONTHS_SINCE_START=$(( (YEAR - START_YEAR) * 12 + (MONTH - START_MONTH) ))
          MONTH_INDEX=$(( MONTHS_SINCE_START + 1 ))
          if [ $MONTH_INDEX -lt 1 ]; then MONTH_INDEX=1; fi
          
          COMMIT_NUM=${{ github.run_number }}
          VERSION="v.$MONTH_INDEX.$DAY.$COMMIT_NUM"
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Detected Version: $VERSION"

      - name: Create Draft and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: "Home.io ${{ steps.get_version.outputs.VERSION }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
