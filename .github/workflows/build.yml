name: Build & Auto Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Verify Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "❌ debug.keystore TIDAK ADA di repo!"
            exit 1
          fi
          echo "✅ Keystore ditemukan"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Extract Version Name
        id: get_version
        run: |
          # Mengambil nilai versionName dari app/build.gradle.kts
          VERSION=$(grep -oP 'val versionNameValue = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Detected Version: $VERSION"

      - name: Check for FORCE_UPDATE in Commit
        id: check_force
        run: |
          # Jika commit message mengandung [force], otomatis jadikan Force Update
          if [[ "${{ github.event.head_commit.message }}" == *"[force]"* ]]; then
            echo "NOTES=FORCE_UPDATE=true" >> $GITHUB_OUTPUT
            echo "✅ Force Update AKTIF"
          else
            echo "NOTES=Auto-release dari commit terbaru." >> $GITHUB_OUTPUT
            echo "ℹ️ Release Normal"
          fi

      - name: Create GitHub Release & Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          NOTES="${{ steps.check_force.outputs.NOTES }}"
          
          echo "🚀 Membuat Release untuk tag: $VERSION"
          
          # Hapus release lama jika ada (opsional, agar tidak error saat re-run)
          gh release delete "$VERSION" --yes 2>/dev/null || true
          
          # Buat release baru dan upload APK
          gh release create "$VERSION" \
            --title "Home.io $VERSION" \
            --notes "$NOTES" \
            app/build/outputs/apk/debug/*.apk
