name: Build Home.io APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Verify Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "❌ debug.keystore TIDAK ADA di repo!"
            echo "Jalankan dulu workflow 'Setup Keystore' dari tab Actions."
            exit 1
          fi
          echo "✅ Keystore ditemukan: $(wc -c < debug.keystore) bytes"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HomeIO-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
