name: Build & Auto Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Verify Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "❌ debug.keystore TIDAK ADA di repo!"
            exit 1
          fi
          echo "✅ Keystore ditemukan"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Generate Version Tag
        id: get_version
        run: |
          YEAR=$(TZ='Asia/Jakarta' date +%Y)
          MONTH=$(TZ='Asia/Jakarta' date +%m)
          DAY=$(TZ='Asia/Jakarta' date +%d)
          
          START_YEAR=2026
          START_MONTH=10
          
          MONTHS_SINCE_START=$(( (YEAR - START_YEAR) * 12 + (MONTH - START_MONTH) ))
          MONTH_INDEX=$(( MONTHS_SINCE_START + 1 ))
          if [ $MONTH_INDEX -lt 1 ]; then MONTH_INDEX=1; fi
          
          COMMIT_NUM=${{ github.run_number }}
          VERSION="v.$MONTH_INDEX.$DAY.$COMMIT_NUM"
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Detected Version: $VERSION"

      - name: Force Clean Up Old Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Menghapus release & tag lama jika ada..."
          gh release delete "$VERSION" --yes 2>/dev/null || true
          git push origin :refs/tags/"$VERSION" 2>/dev/null || true

      - name: Create Draft Release
        id: create_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          NOTES="Auto-release dari commit terbaru."
          
          if [[ "${{ github.event.head_commit.message }}" == *"[force]"* ]]; then
            NOTES="FORCE_UPDATE=true\n\nAuto-release dari commit terbaru."
          fi

          echo "🚀 Membuat DRAFT Release untuk tag: $VERSION"
          gh release create "$VERSION" \
            --draft \
            --title "Home.io $VERSION" \
            --notes "$NOTES"
            
          echo "✅ Draft Release $VERSION berhasil dibuat."

      - name: Upload APK to Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ File APK tidak ditemukan!"
            exit 1
          fi
          
          echo "📦 Meng-upload APK ($APK_PATH) ke Draft $VERSION..."
          gh release upload "$VERSION" "$APK_PATH" --clobber
          echo "✅ APK berhasil di-upload."

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "🔓 Mempublish Release $VERSION..."
          gh release edit "$VERSION" --draft=false
          echo "✅ Release $VERSION sekarang PUBLISHED dan bisa di-download!"
