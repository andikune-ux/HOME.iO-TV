name: Build & Auto Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Verify Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "❌ debug.keystore TIDAK ADA di repo!"
            exit 1
          fi
          echo "✅ Keystore ditemukan"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Generate Version Tag
        id: get_version
        run: |
          YEAR=$(TZ='Asia/Jakarta' date +%Y)
          MONTH=$(TZ='Asia/Jakarta' date +%m)
          DAY=$(TZ='Asia/Jakarta' date +%d)
          
          START_YEAR=2026
          START_MONTH=10
          
          MONTHS_SINCE_START=$(( (YEAR - START_YEAR) * 12 + (MONTH - START_MONTH) ))
          MONTH_INDEX=$(( MONTHS_SINCE_START + 1 ))
          if [ $MONTH_INDEX -lt 1 ]; then MONTH_INDEX=1; fi
          
          COMMIT_NUM=${{ github.run_number }}
          VERSION="v.$MONTH_INDEX.$DAY.$COMMIT_NUM"
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Detected Version: $VERSION"

      - name: Create and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          NOTES="Auto-release dari commit terbaru."
          
          if [[ "${{ github.event.head_commit.message }}" == *"[force]"* ]]; then
            NOTES="FORCE_UPDATE=true\n\nAuto-release dari commit terbaru."
          fi

          echo "🚀 Membuat Release untuk tag: $VERSION"
          
          # Hapus release lama jika ada (untuk re-run)
          gh release delete "$VERSION" --yes 2>/dev/null || true
          
          # Buat release LANGSUNG PUBLISHED (bukan draft)
          gh release create "$VERSION" \
            --title "Home.io $VERSION" \
            --notes "$NOTES" \
            app/build/outputs/apk/debug/*.apk \
            --latest
            
          echo "✅ Release $VERSION berhasil dibuat dan di-publish!"
