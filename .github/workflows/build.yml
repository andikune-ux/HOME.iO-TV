          keytool -list -v -keystore debug.keystore -storepass android | grep "SHA256:"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Show Generated APK
        run: |
          echo "🔍 Mencari file APK yang dihasilkan..."
          find app/build/outputs/apk/debug -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeIO-TV-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Generate Version Tag & Changelog
        id: get_version
        run: |
          YEAR=$(TZ='Asia/Jakarta' date +%Y)
          MONTH=$(TZ='Asia/Jakarta' date +%m)
          DAY=$(TZ='Asia/Jakarta' date +%d)
          
          START_YEAR=2026
          START_MONTH=10
          
          MONTHS_SINCE_START=$(( (YEAR - START_YEAR) * 12 + (MONTH - START_MONTH) ))
          MONTH_INDEX=$(( MONTHS_SINCE_START + 1 ))
          if [ $MONTH_INDEX -lt 1 ]; then MONTH_INDEX=1; fi
          
          COMMIT_NUM=${{ github.run_number }}
          VERSION="v.$MONTH_INDEX.$DAY.$COMMIT_NUM"
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Detected Version: $VERSION"

          # Ambil log commit terakhir untuk dijadikan Changelog
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log -n 5 --pretty=format:"- %s")
          else
            LOG=$(git log $LAST_TAG..HEAD --pretty=format:"- %s")
          fi
          
          if [ -z "$LOG" ]; then
            LOG="- Tidak ada rincian commit yang tercatat."
          fi
          
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "CHANGELOG<<$EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Create and Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: "HOME.iO TV ${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## Rincian Pembaruan
            
            ${{ steps.get_version.outputs.CHANGELOG }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
