name: Setup Keystore (Jalan Sekali Saja)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Check if keystore already exists
        id: check
        run: |
          if [ -f debug.keystore ]; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate keystore
        if: steps.check.outputs.EXISTS == 'false'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Commit keystore to repo
        if: steps.check.outputs.EXISTS == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f debug.keystore
          git commit -m "chore: add permanent debug keystore [skip ci]"
          git push

      - name: Verify
        run: |
          if [ -f debug.keystore ]; then
            echo "✅ debug.keystore sudah ada di repo"
            ls -la debug.keystore
          else
            echo "❌ debug.keystore gagal dibuat"
            exit 1
          fi
